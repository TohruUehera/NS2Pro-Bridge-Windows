name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install project
        shell: pwsh
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install --upgrade pip
          # PyPI only publishes vgamepad 0.1.0 as an sdist whose metadata
          # launches an interactive ViGEmBus MSI. Preinstall the audited wheel
          # so unattended GitHub runners never enter that installer path.
          ./.venv/Scripts/python.exe -m pip install ./vendor/vgamepad-0.1.0-py3-none-any.whl
          ./.venv/Scripts/python.exe -m pip install -e ".[dev]"
      - name: Test
        shell: pwsh
        run: ./.venv/Scripts/python.exe -m pytest
      - name: Build versioned executable
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = ./.venv/Scripts/python.exe -c "import ns2pro_bridge; print(ns2pro_bridge.__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: NS2ProBridge-v${{ steps.version.outputs.version }}-Windows
          path: dist/v${{ steps.version.outputs.version }}/
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/v${{ steps.version.outputs.version }}/NS2ProBridge-v${{ steps.version.outputs.version }}.exe
            dist/v${{ steps.version.outputs.version }}/THIRD_PARTY_NOTICES.md
            dist/v${{ steps.version.outputs.version }}/VIIPER_LICENSE.txt
