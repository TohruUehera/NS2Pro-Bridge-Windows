name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
          cache: pip
      - name: Install project
        shell: pwsh
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install --upgrade pip
          # This is vgamepad's documented non-interactive installation switch.
          $env:VGAMEPAD_SKIP_VIGEMBUS_INSTALL = "true"
          ./.venv/Scripts/python.exe -m pip install -e ".[dev]"
      - name: Test
        shell: pwsh
        run: ./.venv/Scripts/python.exe -m pytest
      - name: Build versioned executable
        shell: pwsh
        run: |
          $sourceDir = "third_party/source"
          $sourceName = "XinHeLianSheng-Pro2-Bridge-b274daa-source.zip"
          New-Item -ItemType Directory -Path $sourceDir -Force | Out-Null
          Invoke-WebRequest -Uri "https://codeload.github.com/LeonChrome/XinHeLianSheng-Pro2-Bridge/zip/b274daa6ddd4e81eeb902b8aa465d1b0170b5591" -OutFile "$sourceDir/$sourceName"
          $actual = (Get-FileHash "$sourceDir/$sourceName" -Algorithm SHA256).Hash
          $expected = "FC47AD79BE7D43B972B10757653C96262F7B5A6BA2EDDB4C0E61A78AEF5D85C3"
          if ($actual -ne $expected) { throw "VIIPER source archive hash mismatch: $actual" }
          ./scripts/build.ps1
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = ./.venv/Scripts/python.exe -c "import ns2pro_bridge; print(ns2pro_bridge.__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7
        with:
          name: NS2ProBridge-v${{ steps.version.outputs.version }}-Windows
          path: dist/v${{ steps.version.outputs.version }}/
      - name: Attest release executable
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/v${{ steps.version.outputs.version }}/NS2ProBridge-v${{ steps.version.outputs.version }}.exe
            dist/v${{ steps.version.outputs.version }}/NS2ProBridge-v${{ steps.version.outputs.version }}-Windows-x64.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/v${{ steps.version.outputs.version }}/NS2ProBridge-v${{ steps.version.outputs.version }}.exe
            dist/v${{ steps.version.outputs.version }}/NS2ProBridge-v${{ steps.version.outputs.version }}-Windows-x64.zip
            dist/v${{ steps.version.outputs.version }}/THIRD_PARTY_NOTICES.md
            dist/v${{ steps.version.outputs.version }}/VIIPER_LICENSE.txt
            dist/v${{ steps.version.outputs.version }}/XinHeLianSheng-Pro2-Bridge-b274daa-source.zip
